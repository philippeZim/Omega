# Compiles Omega on Windows, macOS and Linux for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: cargo check + tests
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo test --lib

  # Separate from `check`: only a new High or Critical advisory fails this job. The release workflow doesn't
  # depend on it. Ignored advisories and their reasons are in src-tauri/deny.toml.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable

      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit@0.23.0 cargo-deny@0.22.0

      # These exit non-zero on any finding. The gate below decides what blocks.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --json > "$RUNNER_TEMP/cargo-audit.json" || true

      - name: pnpm audit
        run: pnpm audit --json > "$RUNNER_TEMP/pnpm-audit.json" || true

      # Advisories, licenses, bans and sources. Findings show in the log but don't block a merge.
      - name: cargo deny
        continue-on-error: true
        run: cargo deny --manifest-path src-tauri/Cargo.toml --locked check

      - name: Fail on new High or Critical advisories
        run: node dev/audit-gate.mjs "$RUNNER_TEMP/cargo-audit.json" "$RUNNER_TEMP/pnpm-audit.json"
