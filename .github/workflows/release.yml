# Builds Omega for Windows, macOS (Apple Silicon + Intel) and Linux and attaches the
# installers to a GitHub release. Trigger: push a tag like `v0.1.0`, or run it manually.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # The updater compares versions, so a tag that doesn't match the app version would break it.
      - name: Read the app version (and check it matches the tag)
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v in tauri.conf.json"
            exit 1
          fi

      # Fails before the long build if CHANGELOG.md has no entry for this version, or on a tag, no release date.
      - name: Read the release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          release_flag=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then release_flag=(--release); fi
          notes=$(node dev/changelog-notes.mjs "$VERSION" --plain "${release_flag[@]}")
          delimiter="NOTES_$RANDOM$RANDOM"
          {
            echo "plain<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Omega v__VERSION__"
          # tauri-action writes this into latest.json's `notes`, which the update dialog shows as plain text.
          releaseBody: ${{ steps.notes.outputs.plain }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Runs once, only after every build succeeded. The release page gets the changelog entry plus the
  # download table, which the update dialog doesn't need.
  release-notes:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the app version
        id: version
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Put the changelog entry and download table on the release page
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.v }}
          DOWNLOADS: |
            ## Which file do I need?

            | Your computer | Download |
            | --- | --- |
            | **Windows** | [Omega_${{ steps.version.outputs.v }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.v }}/Omega_${{ steps.version.outputs.v }}_x64-setup.exe) |
            | **Mac with Apple chip** (M1, M2, M3 …) | [Omega_${{ steps.version.outputs.v }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.v }}/Omega_${{ steps.version.outputs.v }}_aarch64.dmg) |
            | **Mac with Intel chip** | [Omega_${{ steps.version.outputs.v }}_x64.dmg](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.v }}/Omega_${{ steps.version.outputs.v }}_x64.dmg) |
            | **Linux** (any distribution) | the command below, or [the AppImage](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.v }}/Omega_${{ steps.version.outputs.v }}_amd64.AppImage) |

            **Linux and macOS** in one step (installs, adds Omega to your app menu):
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Not sure which Mac you have? Apple menu → *About This Mac*: "Chip: Apple M…" means Apple chip.

            ### First start
            The app isn't code-signed yet, so the first launch shows a warning:
            - **Windows:** "More info" → "Run anyway".
            - **macOS:** right-click Omega in Applications → *Open* (the install command above does this for you).

            After that, Omega updates itself.

            <details><summary>Other files</summary>

            `.msi` is an alternative Windows installer; `.AppImage`, `.deb` and `.rpm` are for Linux (only the AppImage updates itself); `.tar.gz`, `.sig` and `latest.json` are used by the updater.
            </details>
        run: |
          release_flag=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then release_flag=(--release); fi
          notes=$(node dev/changelog-notes.mjs "$VERSION" "${release_flag[@]}")
          printf '%s\n\n%s\n' "$notes" "$DOWNLOADS" > "$RUNNER_TEMP/release-body.md"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-body.md"
