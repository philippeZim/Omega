# x86-64-v2 (SSE4.2, POPCNT, ~2009+): runs on practically every PC still in use.
# v3 (AVX2) would exclude many Celeron/Pentium Silver laptops, so we stop at v2.
# Apple Silicon builds already target apple-m1 by default.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]
