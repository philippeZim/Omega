[package]
name = "ide"
version = "0.2.1"
description = "Omega – an editor for text, Markdown, LaTeX and code"
authors = ["philippeZim"]
repository = "https://github.com/philippeZim/Omega"
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
spellbook = "0.4.2"
flate2 = "1.1.11"
portable-pty = "0.9.0"
base64 = "0.23.1"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
ignore = "0.4.34"
regex = "1.13.2"
sha2 = "0.10"
globset = "0.4.21"
iroh = "1.5.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "net", "io-util", "signal"] }
tiny_http = "0.12.0"
tokio-tungstenite = "0.30"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
ureq = "2"
tar = "0.4"
notify = "8"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the build through Tauri; file lists on the clipboard (#299).
gtk = "0.18"
gdk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Maximum runtime performance: whole-program LTO, one codegen unit, no unwinding, no debug info.
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
debug = false
incremental = false

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the build through `url`; compares file names the way APFS does.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# Already in the build through Tauri; files on the pasteboard (#299).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
