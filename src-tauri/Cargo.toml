[package]
name = "ide"
version = "0.1.0"
description = "Studio – an editor for text, Markdown, LaTeX and code"
authors = ["philippeZim"]
repository = "https://github.com/philippeZim/Omega"
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
spellbook = "0.4.2"
flate2 = "1.1.11"
portable-pty = "0.9.0"
base64 = "0.23.1"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
ignore = "0.4.34"
regex = "1.13.2"
globset = "0.4.21"
iroh = "1.5.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "net", "io-util"] }
tiny_http = "0.12.0"
tokio-tungstenite = "0.28"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
ureq = "2"
tar = "0.4"
notify = "8"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
